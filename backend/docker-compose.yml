# Local development stack: Postgres + Temporal server, API and workers.
# No Redis, no RabbitMQ, no Celery, no Kubernetes (Rule 2).
#
# Host ports are overridable because 5432/5433 are already taken on some machines:
#   POSTGRES_HOST_PORT=55432 TEMPORAL_HOST_PORT=17233 docker compose up -d
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: botbuilder
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/auto-setup:1.27.2}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: default
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "${TEMPORAL_HOST_PORT:-7233}:7233"

  api:
    build:
      context: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/botbuilder
      TEMPORAL_HOST: temporal:7233
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker-agent:
    build:
      context: .
    command: ["python", "-m", "app.infrastructure.temporal.worker", "--queues", "agent"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/botbuilder
      TEMPORAL_HOST: temporal:7233
    volumes:
      - ./app:/app/app
      # Knowledge indexing happens here, so it must see the same blobs the API wrote.
      - data:/data
    depends_on:
      - temporal

  worker-build:
    build:
      context: .
    command: ["python", "-m", "app.infrastructure.temporal.worker", "--queues", "build"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/botbuilder
      TEMPORAL_HOST: temporal:7233
    volumes:
      - ./app:/app/app
      # The Docker build context and artifacts live on the data volume too.
      - data:/data
    depends_on:
      - temporal

volumes:
  postgres-data:
  data:
