[project]
name = "bot-builder-backend"
version = "0.1.0"
description = "Durable AI agent backend for the Aether bot-builder workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "temporalio>=1.8",
    "httpx>=0.27",
    "openai>=1.54",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "langgraph>=0.2.50",
    "sse-starlette>=2.1",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Test doubles intentionally ignore arguments they do not need.
"tests/**" = ["ARG002", "ARG005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a real Postgres and/or Temporal test environment",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
